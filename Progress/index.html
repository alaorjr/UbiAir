-03:00", "feature": "F12", "title": "Portal de criação do PAT", "action": "start", "note": "Atualizar os dois acessos ao portal PAT e orientar login/criação de conta e geração do token."}, {"at": "2026-10-14T08:40:16-03:00", "feature": "F11", "title": "Identidade UbiAir", "action": "done", "note": "UbiAir 0.1.2 (build 3), Bundle Identifier e serviço Chaves transitórios, revisados em F16. País/Client ID legados migrados quando ausentes; PAT será informado novamente pelo usuário. 13 testes offline, release, assinatura e smoke do popover passaram; nome e metadados conferidos, app normal iniciado."}, {"at": "2026-10-14T08:29:00-03:00", "feature": "F11", "title": "Identidade UbiAir", "action": "start", "note": "Renomear o aplicativo para UbiAir com identificador transitório (revisado em F16); adaptar build, interface e documentação, preservando configuração anterior."}, {"at": "2026-10-13T16:37:49-03:00", "feature": "F10", "title": "Popover e visual inspirado no TCLimate", "action": "done", "note": "Versão 0.1.1: popover nativo ancorado e não destacável, sem janela separada; visual inspirado no GIF. Build release e assinatura passaram, 9 testes offline sem falhas, smoke de abertura/fechamento/reabertura e controles em demonstração conferidos pela interface."}, {"at": "2026-10-13T16:37:48-03:00", "feature": "F08", "title": "Validação com os aparelhos", "action": "pending", "note": "Conexão, listagem e estado reais observados na interface configurada pelo usuário. Comandos físicos e validação dos modelos continuam pendentes; o agente acionou controles somente em demonstração."}, {"at": "2026-10-13T15:55:04-03:00", "feature": "F10", "title": "Popover e visual inspirado no TCLimate", "action": "start", "note": "Remover janela de prévia e redesenhar o painel pelo GIF fornecido, preservando os controles ThinQ existentes."}, {"at": "2026-10-13T15:42:04-03:00", "feature": "F08", "title": "Validação com os aparelhos", "action": "pending", "note": "Versão 0.1.0 pronta para o usuário inserir PAT no app e validar seus aparelhos reais; nenhum comando real foi enviado."}, {"at": "2026-10-13T15:42:04-03:00", "feature": "F07", "title": "Testes e aplicativo local", "action": "done", "note": "9 testes offline passaram; release empacotado, assinatura ad hoc verificada e app iniciado. Verificação visual documentada em Docs/VALIDATION.md."}, {"at": "2026-10-13T15:42:04-03:00", "feature": "F06", "title": "Controles e confirmação", "action": "done", "note": "Controles de temperatura, modo, ventilação, oscilação e energia testados na demonstração; confirmação e bloqueios implementados. Hardware real pendente em F08."}, {"at": "2026-10-13T15:42:04-03:00", "feature": "F04", "title": "Interface na barra de menus", "action": "done", "note": "Interface SwiftUI compilada e verificada: demonstração, seleção de dois aparelhos e formulário PAT/BR funcionando."}, {"at": "2026-10-13T12:12:52-03:00", "feature": "F05", "title": "Credenciais e preferências", "action": "done", "note": "PAT no Chaves, Client ID estável e Login Items implementados; código compilado. Uso real do Chaves/Login Items depende da instalação final."}, {"at": "2026-10-13T12:12:52-03:00", "feature": "F03", "title": "Cliente Swift ThinQ", "action": "done", "note": "Cliente REST Swift concluído; 9 testes offline passaram. Inclui perfis variáveis, unidade correta, cancelamento e validação de comandos."}, {"at": "2026-10-13T12:10:05-03:00", "feature": "F07", "title": "Testes e aplicativo local", "action": "start", "note": "Primeira compilação passou; executando testes offline, revisão de concorrência e preparação do bundle macOS."}, {"at": "2026-10-13T12:06:21-03:00", "feature": "F06", "title": "Controles e confirmação", "action": "start", "note": "Controles derivados do perfil e confirmação do estado na nuvem; sem comandos em aparelhos durante desenvolvimento."}, {"at": "2026-10-13T12:02:05-03:00", "feature": "F05", "title": "Credenciais e preferências", "action": "start", "note": "Luna implementa Chaves do macOS, Client ID persistente e Login Items."}, {"at": "2026-10-13T12:02:05-03:00", "feature": "F04", "title": "Interface na barra de menus", "action": "start", "note": "Sol integra SwiftUI, fluxo de conexão, seleção, demonstração e estado de comandos."}, {"at": "2026-10-13T12:02:05-03:00", "feature": "F03", "title": "Cliente Swift ThinQ", "action": "start", "note": "Luna implementa cliente, perfis, comandos e testes offline em ThinQCore."}, {"at": "2026-10-13T12:02:05-03:00", "feature": "F02", "title": "Pesquisa e contrato da API", "action": "done", "note": "Protocolo confirmado no SDK oficial; BR usa AIC. route é para MQTT, não para seleção REST. Pesquisa e limitações documentadas."}, {"at": "2026-10-13T12:00:17-03:00", "feature": "F01", "title": "Painel e continuidade", "action": "done", "note": "Painel HTML, histórico e guia de retomada criados; atualização por transição de funcionalidade."}, {"at": "2026-10-13T11:58:00-03:00", "feature": "F00", "title": "Repositório e coordenação", "action": "done", "note": "Git criado antes da implementação. Conta Brasil e autenticação por PAT confirmadas pelo usuário."}], "resume": "Leia Docs/CONTINUITY.md, Docs/DECISIONS.md e este painel. Confira git status e o último commit antes de continuar.", "references": [{"label": "TCLimate", "url": "https://github.com/umarz317/TCLimate"}, {"label": "SDK oficial Python", "url": "https://github.com/thinq-connect/pythinqconnect"}, {"label": "API ThinQ Connect", "url": "https://smartsolution.developer.lge.com/en/apiManage/thinq_connect"}]};
  const labels = {done:'Concluído',active:'Em andamento',todo:'Planejado',pending:'A validar',blocked:'Bloqueado'};
  const actions = {done:'Concluído',start:'Iniciado',pending:'Aguardando validação',blocked:'Bloqueado'};
  let last = '';
  const date = value => new Date(value).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',dateStyle:'short',timeStyle:'short'});
  function node(tag,text,className){const n=document.createElement(tag);n.textContent=text;if(className)n.className=className;return n}
  function render(data){
    const key=JSON.stringify(data);if(key===last)return;last=key;
    document.getElementById('title').textContent=data.project;document.getElementById('goal').textContent=data.goal;document.getElementById('updated').textContent='Atualizado: '+date(data.updatedAt);document.getElementById('resume').textContent=data.resume;
    const done=data.features.filter(f=>f.status==='done').length, active=data.features.filter(f=>f.status==='active').length;
    const summary=document.getElementById('summary');summary.replaceChildren();for(const [value,label] of [[done,'concluídas'],[active,'em andamento'],[data.features.length-done-active,'a fazer ou validar']]){const box=node('div','');box.append(node('strong',value),node('span',label));summary.append(box)}
    const progress=document.getElementById('progress');progress.max=data.features.length;progress.value=done;
    for(const id of ['active','done','todo'])document.getElementById(id).replaceChildren();
    for(const f of data.features){const card=node('article','',f.status);card.append(node('span',f.id+' · '+labels[f.status],'tag'),node('h3',f.title),node('p',f.description));if(f.note)card.append(node('p',f.note,'note'));document.getElementById(['active','done'].includes(f.status)?f.status:'todo').append(card)}
    for(const id of ['active','done','todo']){const lane=document.getElementById(id);if(!lane.children.length)lane.append(node('p','Nenhuma etapa nesta coluna.','empty'))}
    const events=document.getElementById('events');events.replaceChildren();for(const e of data.events.slice(0,24)){const item=node('li',''),text=node('div','');text.append(node('strong',actions[e.action]+' · '+e.title),node('p',e.note));item.append(node('time',date(e.at)),text);events.append(item)}
    const refs=document.getElementById('references');refs.replaceChildren();for(const ref of data.references){const a=node('a',ref.label);a.href=ref.url;a.target='_blank';a.rel='noreferrer';refs.append(a)}
  }
  render(initial);
  if(location.protocol==='http:'||location.protocol==='https:'){setInterval(async()=>{try{const response=await fetch('progress.json',{cache:'no-store'});if(response.ok)render(await response.json())}catch{}},3000);document.getElementById('live').textContent='Acompanhamento automático · atualização a cada 3 s'}else{setTimeout(()=>location.reload(),15000)}
