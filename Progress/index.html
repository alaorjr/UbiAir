<script>
  const initial = {"project": "UbiAir para macOS", "updatedAt": "2026-10-22T11:46:35-03:00", "goal": "Controlar os aparelhos LG pela barra de menus, com SwiftUI e a API oficial ThinQ Connect.", "features": [{"id": "F00", "title": "Repositório e coordenação", "description": "Git local e política de subagentes econômicos.", "status": "done", "note": "Commit inicial d5f302e; Sol coordena e Luna executa tarefas delimitadas."}, {"id": "F01", "title": "Painel e continuidade", "description": "Progresso visual, registro de decisões e guia de retomada.", "status": "done", "note": "Painel HTML, histórico e guia de retomada criados; atualização por transição de funcionalidade.", "updatedAt": "2026-10-13T12:00:17-03:00"}, {"id": "F02", "title": "Pesquisa e contrato da API", "description": "Confirmar autenticação, endpoints, perfis e payloads no SDK oficial.", "status": "done", "note": "Protocolo confirmado no SDK oficial; BR usa AIC. route é para MQTT, não para seleção REST. Pesquisa e limitações documentadas.", "updatedAt": "2026-10-13T12:02:05-03:00"}, {"id": "F03", "title": "Cliente Swift ThinQ", "description": "Roteamento regional, lista, perfil, estado e erros da API.", "status": "done", "note": "Cliente REST Swift concluído; 9 testes offline passaram. Inclui perfis variáveis, unidade correta, cancelamento e validação de comandos.", "updatedAt": "2026-10-13T12:12:52-03:00"}, {"id": "F04", "title": "Interface na barra de menus", "description": "Conexão por PAT, seleção de aparelho, estado e demonstração.", "status": "done", "note": "Interface SwiftUI compilada e verificada: demonstração, seleção de dois aparelhos e formulário PAT/BR funcionando.", "updatedAt": "2026-10-13T15:42:04-03:00"}, {"id": "F05", "title": "Credenciais e preferências", "description": "Chaves do macOS, Client ID persistente e início de sessão opcional.", "status": "done", "note": "PAT no Chaves, Client ID estável e Login Items implementados; código compilado. Uso real do Chaves/Login Items depende da instalação final.", "updatedAt": "2026-10-13T12:12:52-03:00"}, {"id": "F06", "title": "Controles e confirmação", "description": "Ligar/desligar, temperatura, modo, ventilação e direção conforme o perfil.", "status": "done", "note": "Controles de temperatura, modo, ventilação, oscilação e energia testados na demonstração; confirmação e bloqueios implementados. Validação real concluída pelo usuário em três aparelhos (F08).", "updatedAt": "2026-10-13T15:42:04-03:00"}, {"id": "F07", "title": "Testes e aplicativo local", "description": "Testes offline, compilação, empacotamento e verificação visual.", "status": "done", "note": "9 testes offline passaram; release empacotado, assinatura ad hoc verificada e app iniciado. Verificação visual documentada em Docs/VALIDATION.md.", "updatedAt": "2026-10-13T15:42:04-03:00"}, {"id": "F08", "title": "Validação com os aparelhos", "description": "Confirmar conexão e comandos com seu PAT e modelos reais.", "status": "done", "note": "O usuário confirmou teste manual em três aparelhos reais e relatou que tudo funcionou, após o marco de identidade F16. Validação básica concluída; nenhum PAT ou dado real de aparelho registrado.", "updatedAt": "2026-10-14T13:21:07-03:00"}, {"id": "F09", "title": "Evoluções após o MVP", "description": "Energia, eventos MQTT e controles adicionais disponíveis nos modelos.", "status": "todo", "note": "Planejado para após a validação básica; depende das capacidades da API."}, {"id": "F10", "title": "Popover e visual inspirado no TCLimate", "description": "Painel ancorado ao ícone, visual translúcido e ilustração do aparelho.", "status": "done", "note": "Versão 0.1.1: popover nativo ancorado e não destacável, sem janela separada; visual inspirado no GIF. Build release e assinatura passaram, 9 testes offline sem falhas, smoke de abertura/fechamento/reabertura e controles em demonstração conferidos pela interface.", "updatedAt": "2026-10-13T16:37:49-03:00"}, {"id": "F11", "title": "Identidade UbiAir", "description": "Nome UbiAir e migração das preferências; identidade revisada em F16.", "status": "done", "note": "UbiAir 0.1.2 (build 3), Bundle Identifier e serviço Chaves transitórios, revisados em F16. País/Client ID legados migrados quando ausentes; PAT será informado novamente pelo usuário. 13 testes offline, release, assinatura e smoke do popover passaram; nome e metadados conferidos, app normal iniciado.", "updatedAt": "2026-10-14T08:40:16-03:00"}, {"id": "F12", "title": "Portal de criação do PAT", "description": "Link correto e orientação para entrar/criar conta e gerar o PAT.", "status": "done", "note": "Os dois acessos usam connect-pat.lgthinq.com/login. Formulário orienta conta LG ThinQ, criação pelo app se necessária, geração do PAT no portal e inserção no UbiAir. URL e página conferidas; release compilado.", "updatedAt": "2026-10-14T09:36:33-03:00"}, {"id": "F13", "title": "Fechamento ao clicar fora", "description": "Restaurar fechamento do popover após usar o menu da engrenagem.", "status": "done", "note": "Monitores de clique e perda de ativação fecham o painel após menus. Teste interativo em demonstração confirmou engrenagem → retorno ao painel → clique fora → fechamento; smoke e release passaram.", "updatedAt": "2026-10-14T09:36:33-03:00"}, {"id": "F14", "title": "Indicadores de energia dos aparelhos", "description": "Verde para ligado, vermelho para desligado e seleção independente.", "status": "done", "note": "Verde ligado, vermelho desligado e cinza desconhecido, independente da seleção. Cache por ID com guardas de sessão/lote, cancelamento e sem consultas duplicadas. 19 testes totais passaram, incluindo 6 de energia; seleção e cores conferidas na demonstração.", "updatedAt": "2026-10-14T09:36:34-03:00"}, {"id": "F15", "title": "Painel mais alto sem barra de rolagem", "description": "Acomodar confirmação de comandos e direção do ar no painel.", "status": "done", "note": "Popover 360×740 (antes 360×650), área central até 650 e indicadores ocultos. Build release, assinatura e smoke passaram; confirmação após comando e duas oscilações expandidas conferidas na demonstração, tudo visível sem precisar rolar.", "updatedAt": "2026-10-14T09:47:30-03:00"}, {"id": "F16", "title": "Identidade final ai.ubiquu.UbiAir", "description": "Eliminar o identificador pessoal e alinhar código, testes, bundle e documentação.", "status": "done", "note": "UbiAir 0.1.5 (build 6), Bundle Identifier e serviço Chaves ai.ubiquu.UbiAir. Identificador pessoal retirado, artefatos antigos eliminados e documentação alinhada. Recompilação limpa, 19 testes offline, assinatura, metadados e smoke em demonstração passaram. PAT deve ser informado novamente na interface; histórico Git preservado.", "updatedAt": "2026-10-14T13:15:51-03:00"}, {"id": "F17", "title": "Erros e recuperação amigáveis", "description": "Aparelhos offline, falhas de rede/API, PAT inválido e ausência de aparelhos compatíveis.", "status": "done", "note": "UbiAir 0.1.6 (build 7): mensagens e recuperação para offline, rede/timeout, PAT, permissões, quota/API e conta sem ar-condicionados. Bloqueio após falha, pausa por autenticação/quota, sem reenviar comandos. 32 testes offline, release, assinatura e smoke em cenários fictícios passaram; identidade carregada conferida. Inspeção pela ferramenta nativa teve cache/timeout, documentado em VALIDATION.md.", "updatedAt": "2026-10-14T13:42:35-03:00"}, {"id": "F18", "title": "Projeto Xcode e sandbox", "description": "Target macOS, assinatura local e permissões mínimas para preparar a Mac App Store.", "status": "done", "note": "UbiAir 0.1.7/build 8: projeto e scheme Xcode, sandbox com somente saída de rede, Release universal e Debug sem conta ativa compilados. Assinatura, ícone e metadados verificados; storage fictício, HTTPS público e popover normal/offline passaram. 32 testes offline sem falhas. Validação real do novo build fica em F21.", "updatedAt": "2026-10-14T22:14:55-03:00"}, {"id": "F19", "title": "Recursos e privacidade para distribuição", "description": "Ícone, metadados, manifesto e rascunhos de suporte/privacidade/revisão.", "status": "done", "note": "Recursos preparados: ícone original provisório reprodutível, catálogo macOS, Info.plist, manifesto para preferências próprias, avisos de terceiros e rascunhos de política/suporte/App Review. Plists/JSON/recursos compilados conferidos. Publicação e declarações finais de privacidade pendentes em F20.", "updatedAt": "2026-10-14T22:14:55-03:00"}, {"id": "F20", "title": "Assinatura e submissão à Mac App Store", "description": "Conta ativa, certificados, TestFlight, cadastro comercial e revisão da Apple.", "status": "pending", "note": "Team Release configurado localmente, mas Archive/upload/conta/contratos sem validação; assinatura atual falhou (CSSMERR_TP_NOT_TRUSTED e aviso de entitlements). F29 confirmou restrição PAT LG pessoal/não comercial e consentimento escrito para serviços adicionais não autorizados; pedir confirmação aplicável à distribuição/monetização do UbiAir. Pedido e notas App Review prontos, nada enviado. Privacidade/suporte, dados da loja, material e F21 seguem pendentes.", "updatedAt": "2026-10-16T11:08:53-03:00"}, {"id": "F21", "title": "Validação da versão sandboxed", "description": "Aparelhos reais, Chaves após reabrir/instalar e Login Items com a assinatura escolhida.", "status": "pending", "note": "O usuário já validou a versão anterior em três aparelhos (F08). Novo sandbox passou em demo, Chaves fictício e HTTPS público; falta validar aparelhos reais, PAT após reabrir/instalar, fechamento após menus e Login Items com assinatura escolhida.", "updatedAt": "2026-10-14T22:14:55-03:00"}, {"id": "F22", "title": "Botão de diminuir temperatura", "description": "Investigar clique ativo sem resposta e validar redução, limites e exceções.", "status": "done", "note": "O usuário confirmou que o botão menos voltou a funcionar na versão 0.1.8. Área clicável integral validada manualmente; 37 testes offline e builds já passaram.", "updatedAt": "2026-10-14T22:32:36-03:00"}, {"id": "F23", "title": "Feedback ao arrastar a temperatura", "description": "Exibir a temperatura escolhida durante o arraste do slider, antes do envio.", "status": "done", "note": "Usuário aprovou a funcionalidade de prévia da temperatura durante o arraste. Pediu somente retirar as marcações visuais do slider; ajuste em F24.", "updatedAt": "2026-10-14T22:39:41-03:00"}, {"id": "F24", "title": "Slider sem marcações", "description": "Restaurar trilho contínuo e limpo, mantendo a prévia da temperatura.", "status": "done", "note": "UbiAir 0.1.10/build 11: retirado step visual para restaurar trilho contínuo sem marcas. Prévia, temperaturas permitidas e envio ao soltar preservados. Builds SPM/Xcode universal, assinatura/verificador e smoke do popover passaram; sem comando real.", "updatedAt": "2026-10-14T22:40:35-03:00"}, {"id": "F25", "title": "Exploração do ícone para a loja", "description": "Três propostas visuais de ícone para comparação e escolha do usuário.", "status": "done", "note": "Três propostas PNG geradas com image_gen, inspecionadas visualmente e salvas com prompts em Docs/Design/AppIcon-2026-10-15. Escolha/refinamento pelo usuário é a próxima etapa; catálogo e versão do app preservados.", "updatedAt": "2026-10-15T07:55:41-03:00"}, {"id": "F26", "title": "Ícone final Ar em casa no Xcode", "description": "Finalizar a opção 2, gerar o catálogo macOS completo e validar no build Xcode.", "status": "done", "note": "Opção 2 aplicada: matriz 1024 RGBA sRGB e dez PNGs AppIcon, contorno Swift autorizado. Debug Xcode passou após alinhar arquitetura ativa; Release universal/verificador, catálogo compilado, ICNS legado e assinatura passaram. Procedimento em Docs/Design/AppIcon-2026-10-15/PRODUCTION.md.", "updatedAt": "2026-10-15T08:08:44-03:00"}, {"id": "F27", "title": "Caminho de build sandbox no Xcode", "description": "Alinhar o build da interface Xcode com a pasta local XcodeSandbox e explicar Debug/Release.", "status": "done", "note": "CONFIGURATION_BUILD_DIR alinhado à pasta local por configuração. Projeto UbiAir aberto/esquema UbiAir selecionado; BuildProject atualizou Debug de 0.1.7/8 para 0.1.10/11. Assinatura/sandbox conferidos e Release universal/verificador passaram. Guia distingue pacote, Debug e Release.", "updatedAt": "2026-10-15T08:23:37-03:00"}, {"id": "F28", "title": "Auditoria de requisitos da Mac App Store", "description": "Comparar código, artefato e preparação com os requisitos oficiais da Apple.", "status": "done", "note": "Auditoria concluída em Docs/APP-STORE-AUDIT.md com fontes oficiais Apple, revisão estática independente e verificação do artefato atual. Faltam assinatura/Archive válido, privacidade/suporte in-app e públicos, dados da loja, material/vídeo/acesso, termos LG e F21. Verificador falhou em assinatura; sem código alterado, rebuild, PAT ou comandos reais. F20/F21 pendentes.", "updatedAt": "2026-10-16T10:12:49-03:00"}, {"id": "F29", "title": "Termos LG PAT e documentação para App Review", "description": "Investigar termos oficiais do ThinQ Connect/PAT e preparar evidências, pedido LG e notas para revisão.", "status": "done", "note": "Criada versão objetiva em Docs/LG-PERMISSION-REQUEST-SHORT.md; versão completa preservada integralmente. Mantidos origem pessoal, PAT direto/sem dados ao desenvolvedor, US$ 0,99, Brasil/expansão, precedente Home Assistant e confirmação LG/Apple. Comparação de conteúdo e diff check; nada enviado; F20/F21 pendentes.", "updatedAt": "2026-10-16T12:03:17-03:00"}, {"id": "F30", "title": "Capturas do aplicativo para pedido à LG", "description": "Preparar screenshots reais da interface em demonstração, sem credenciais ou dados de aparelhos.", "status": "done", "note": "Preparados e inspecionados 2 PNGs nativos da view SwiftUI 0.1.10: conexão com PAT vazio e controles fictícios, 720x1480. ZIP conferido (2 PNG + README inglês) em build/UbiAir-LG-screenshots.zip; pedido LG atualizado. Helper isolado compilou/exportou; bash -n e diff check passaram. Camada nativa evita omissões do cache; terceiro estado inconsistente descartado. Sem PAT, aparelho real, chamadas LG ou envio externo; produto inalterado.", "updatedAt": "2026-10-16T11:46:45-03:00"}, {"id": "F31", "title": "Publicação segura no GitHub", "description": "Revisar dados sensíveis e histórico, configurar exclusões, documentar Xcode e GIF fictício e publicar repositório público.", "status": "done", "note": "README corrigido para Xcode 27, testado em Xcode 27.1/macOS 27.0.1. Mínimo real macOS 14 conferido nos arquivos de build; sistemas anteriores e Xcodes anteriores explicitamente não validados. Continuidade/decisões coerentes; diff check passou. Somente documentação, sem repetir testes ou builds.", "updatedAt": "2026-10-22T11:39:10-03:00"}, {"id": "F32", "title": "Licença MIT e apoio ao projeto", "description": "Licenciar o código sob MIT e adicionar contribuição voluntária por PayPal no repositório.", "status": "done", "note": "MIT integral em LICENSE (Alaor Jr, 2026), README e atribuições atualizados. Buy me a coffee orienta apoio via email PayPal cuja publicação foi autorizada. Link Donate retornou conta não qualificada e foi descartado; checkout direto depende de link emitido na conta. Links locais/âncora e diff check passaram; sem login, pagamento, mudança no produto ou novos builds/testes.", "updatedAt": "2026-10-22T11:46:35-03:00"}], "events": [{"at": "2026-10-22T11:46:35-03:00", "feature": "F32", "title": "Licença MIT e apoio ao projeto", "action": "done", "note": "MIT integral em LICENSE (Alaor Jr, 2026), README e atribuições atualizados. Buy me a coffee orienta apoio via email PayPal cuja publicação foi autorizada. Link Donate retornou conta não qualificada e foi descartado; checkout direto depende de link emitido na conta. Links locais/âncora e diff check passaram; sem login, pagamento, mudança no produto ou novos builds/testes."}, {"at": "2026-10-22T11:45:23-03:00", "feature": "F32", "title": "Licença MIT e apoio ao projeto", "action": "start", "no   const labels = {done:'Concluído',active:'Em andamento',todo:'Planejado',pending:'A validar',blocked:'Bloqueado'};
  const actions = {done:'Concluído',start:'Iniciado',pending:'Aguardando validação',blocked:'Bloqueado'};
  let last = '';
  const date = value => new Date(value).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',dateStyle:'short',timeStyle:'short'});
  function node(tag,text,className){const n=document.createElement(tag);n.textContent=text;if(className)n.className=className;return n}
  function render(data){
    const key=JSON.stringify(data);if(key===last)return;last=key;
    document.getElementById('title').textContent=data.project;document.getElementById('goal').textContent=data.goal;document.getElementById('updated').textContent='Atualizado: '+date(data.updatedAt);document.getElementById('resume').textContent=data.resume;
    const done=data.features.filter(f=>f.status==='done').length, active=data.features.filter(f=>f.status==='active').length;
    const summary=document.getElementById('summary');summary.replaceChildren();for(const [value,label] of [[done,'concluídas'],[active,'em andamento'],[data.features.length-done-active,'a fazer ou validar']]){const box=node('div','');box.append(node('strong',value),node('span',label));summary.append(box)}
    const progress=document.getElementById('progress');progress.max=data.features.length;progress.value=done;
    for(const id of ['active','done','todo'])document.getElementById(id).replaceChildren();
    for(const f of data.features){const card=node('article','',f.status);card.append(node('span',f.id+' · '+labels[f.status],'tag'),node('h3',f.title),node('p',f.description));if(f.note)card.append(node('p',f.note,'note'));document.getElementById(['active','done'].includes(f.status)?f.status:'todo').append(card)}
    for(const id of ['active','done','todo']){const lane=document.getElementById(id);if(!lane.children.length)lane.append(node('p','Nenhuma etapa nesta coluna.','empty'))}
    const events=document.getElementById('events');events.replaceChildren();for(const e of data.events.slice(0,24)){const item=node('li',''),text=node('div','');text.append(node('strong',actions[e.action]+' · '+e.title),node('p',e.note));item.append(node('time',date(e.at)),text);events.append(item)}
    const refs=document.getElementById('references');refs.replaceChildren();for(const ref of data.references){const a=node('a',ref.label);a.href=ref.url;a.target='_blank';a.rel='noreferrer';refs.append(a)}
  }
  render(initial);
  if(location.protocol==='http:'||location.protocol==='https:'){setInterval(async()=>{try{const response=await fetch('progress.json',{cache:'no-store'});if(response.ok)render(await response.json())}catch{}},3000);document.getElementById('live').textContent='Acompanhamento automático · atualização a cada 3 s'}else{setTimeout(()=>location.reload(),15000)}
